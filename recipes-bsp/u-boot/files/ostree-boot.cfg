# U-Boot features the OSTree boot script depends on. Without these the image
# builds fine and then fails to boot, so they are not optional.

# The deployed kernel is a FIT image (kernel-1 + ramdisk-1 + FDTs in one file).
# Without FIT support `bootm ${addr}:kernel-1` cannot work at all.
CONFIG_FIT=y
CONFIG_FIT_VERBOSE=y
CONFIG_FIT_SIGNATURE=y

# bootm refuses images larger than SYS_BOOTM_LEN. The default 16 MiB is smaller
# than this board's fitImage (about 16.2 MiB), so raise it to 64 MiB.
CONFIG_SYS_BOOTM_LEN=0x4000000

# Bootloader-level rollback: u-boot counts boot attempts in the saved
# environment and runs altbootcmd once bootlimit is exceeded. This is the whole
# reason the Pi 4 is the board for this project.
CONFIG_BOOTCOUNT_LIMIT=y
CONFIG_BOOTCOUNT_ENV=y

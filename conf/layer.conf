BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Distinct collection name from meta-ota-platform (the Pi 5 layer). The two
# layers ship recipes with the SAME names -- ota-image, homeautomationgui,
# ota-agent -- so they must never be added to the same build. One build
# directory per board.
BBFILE_COLLECTIONS += "ota-platform-rpi4"
BBFILE_PATTERN_ota-platform-rpi4 = "^${LAYERDIR}/"
BBFILE_PRIORITY_ota-platform-rpi4 = "10"

LAYERDEPENDS_ota-platform-rpi4 = "core openembedded-layer meta-python qt6-layer sota raspberrypi"

LAYERSERIES_COMPAT_ota-platform-rpi4 = "scarthgap"
